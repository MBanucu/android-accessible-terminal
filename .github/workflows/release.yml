name: release

# Publishes a tag to Maven Central through the Central Portal and attaches the
# accessibility probe APK to the GitHub release. The Maven secrets are a Central
# Portal user token and a PGP key; see RELEASING.md for how to create them.
# Publishing a GitHub release starts this; workflow_dispatch exists so a failed
# run can be retried for the same version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 0.2.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  maven-central:
    name: publish to Maven Central
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The artifact is built from the tag being released, not from main.
          # A manual run must be started from the tag too: --ref <tag>.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          manager=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
          api=$(bash scripts/versions.sh compileSdk)
          build_tools=$(bash scripts/versions.sh buildTools)
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" "platforms;android-$api" "build-tools;$build_tools" >/dev/null
          echo "ANDROID_HOME=$sdk" >>"$GITHUB_ENV"

      - name: Check the release secrets are present
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          missing=()
          [ -n "${MAVEN_CENTRAL_USERNAME:-}" ] || missing+=("MAVEN_CENTRAL_USERNAME")
          [ -n "${MAVEN_CENTRAL_PASSWORD:-}" ] || missing+=("MAVEN_CENTRAL_PASSWORD")
          [ -n "${SIGNING_KEY:-}" ] || missing+=("SIGNING_KEY")
          [ -n "${SIGNING_PASSWORD:-}" ] || missing+=("SIGNING_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing repository secrets: ${missing[*]} - see RELEASING.md"
            exit 1
          fi

      - name: Publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          version="${{ github.event.release.tag_name || inputs.version }}"
          version="${version#v}"
          echo "publishing $version"
          ./gradlew --no-daemon publishAggregationToCentralPortal -PVERSION_NAME="$version"

  a11y-probe:
    name: publish the accessibility probe
    runs-on: ubuntu-24.04
    # Uploading release assets and editing the release notes need a write token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          manager=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
          api=$(bash scripts/versions.sh compileSdk)
          build_tools=$(bash scripts/versions.sh buildTools)
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" "platforms;android-$api" "build-tools;$build_tools" >/dev/null
          # The probe build is the SDK's tools, not Gradle, so they have to be on
          # PATH rather than only installed.
          echo "$sdk/build-tools/$build_tools" >>"$GITHUB_PATH"

      - name: Build the probe
        env:
          ADB_CONNECT: '0'
        run: |
          set -euo pipefail
          bash a11y-probe/build.sh
          (cd out && sha256sum -c a11y-probe-*.apk.sha256)
          ls -l out/a11y-probe-*.apk out/a11y-probe-*.apk.sha256

      # A dispatch run has no release to attach to; the files are still kept for
      # a manual check of the artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: a11y-probe
          path: |
            out/a11y-probe-*.apk
            out/a11y-probe-*.apk.sha256
          if-no-files-found: error

      - name: Upload the APK and checksums to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          gh release upload "$tag" \
            out/a11y-probe-*.apk out/a11y-probe-*.apk.sha256 --clobber

      - name: Name the probe version in the release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' \
            a11y-probe/AndroidManifest.xml | head -n 1)
          body=$(gh release view "$tag" --json body -q .body)
          if printf '%s\n' "$body" | grep -q '^### Accessibility probe'; then
            echo "the release notes already name the probe"
            exit 0
          fi
          {
            printf '%s\n\n' "$body"
            cat <<EOF
          ### Accessibility probe

          This release carries a11y-probe-$version.apk and its .sha256, the
          accessibility service device suites drive apps with.

          The one-release compatibility APK is a11y-probe-$version-legacy.apk
          (app id io.github.mbanucu.samples.a11yprobe).

              sha256sum -c a11y-probe-$version.apk.sha256
              adb install -r a11y-probe-$version.apk

          probe.sh from this tag installs, enables, disables and restores the
          accessibility setting; see the README.
          EOF
          } > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
