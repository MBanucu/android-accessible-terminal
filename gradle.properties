org.gradle.jvmargs=-Xmx2g
android.nonTransitiveRClass=true

# Reuse task outputs between builds. The local build cache lives in the Gradle
# user home; docs/termux-build.md records what the caches cover.
org.gradle.caching=true

# The build and the release tasks (assembleRelease, publishToMavenLocal,
# nmcpZipAggregation) are configuration-cache compatible. docs/termux-build.md
# records the measured runs.
org.gradle.configuration-cache=true

# This is a Java-only library. AGP 9 otherwise wires its built-in Kotlin support
# into every variant, which adds tasks and a Kotlin toolchain resolution this
# project does not use. Turning it off keeps the task graph Java-only.
android.builtInKotlin=false

# android.aapt2FromMavenOverride is required on Termux, and AGP labels every use
# of it experimental. The override is the documented workaround; suppress only
# that unsupported-option notice, not other AGP warnings.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Retry transient 429/5xx responses from Maven Central; shared CI egress IPs hit
# them often enough that Gradle's default three tries is not enough.
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
